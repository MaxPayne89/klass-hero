name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Unconditional, unlike ci.yml/security.yml: this workflow only ever runs on
# pull_request, so there is no `main` run to protect. Retitling a PR twice in quick
# succession should supersede, not queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      # amannn/action-semantic-pull-request@v6.1.1
      - name: Check PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            deps
            chore
            docs
            style
            test
            ci
            build
            revert
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: "PR title must have a description after the type prefix"
