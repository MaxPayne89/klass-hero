name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

# Supersede an in-flight run when a PR is pushed again. NOT on `main`: fly-deploy.yml
# waits on this workflow via `workflow_run`, so cancelling a main run silently drops a
# dev deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ELIXIR_VERSION: '1.20.2'
  OTP_VERSION: '29.0.2'
  MIX_OS_DEPS_COMPILE_PARTITION_COUNT: '4'

jobs:
  # The ONLY job that writes the cache. Every other job restores it read-only, so the
  # stored tree is deterministically the both-env one this job produces, rather than
  # whichever job happened to win a race to save first.
  #
  # Nothing `needs:` this job. On a warm run it hits the primary key and therefore saves
  # nothing — meaning downstream jobs restore byte-identical content whether or not it
  # ran, and gating them on it was ~55s of pure serialisation. It earns its place only on
  # a cold cache (a mix.lock change), where it is the single writer that seeds the next
  # run. The cost of that: on a cold run the other jobs each compile deps independently,
  # in parallel, and none of them seeds the cache.
  deps:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
      # actions/checkout@v7.0.1
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # erlef/setup-beam@v1.24.1
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      # actions/cache@v6.1.0
      - name: Restore dependencies cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      # Compile all deps once before the NIF force-rebuild. `mix deps.compile
      # lazy_html --force` only rebuilds lazy_html itself — it does NOT
      # trigger compilation of transitive deps (fine, elixir_make,
      # cc_precompiler). On a warm cache they're already in _build/; on a
      # cold cache (e.g. after a runtime bump invalidates the cache key)
      # the --force step fails with "could not find an app file at
      # _build/test/lib/fine/ebin/fine.app".
      - name: Compile dependencies
        run: mix deps.compile
        env:
          MIX_ENV: test

      # Force-recompile NIF deps to prevent stale cache issues.
      # The restore-keys fallback can provide a NIF binary from a
      # previous version that doesn't match the current mix.lock.
      - name: Recompile NIF dependencies
        run: mix deps.compile lazy_html --force
        env:
          MIX_ENV: test

      # Compile both envs so the cache this job seeds is useful to both. Only matters on
      # a cold run — on a warm one the primary key already exists and nothing is saved.
      #
      # (The old comment here claimed dev was "needed by quality job (includes boundary
      # checker)". The boundary library was removed in #986-#1002, and a probe showed
      # quality rebuilds the dev tree regardless — see the commit message.)
      - name: Compile (dev)
        run: mix compile

      - name: Compile (test)
        run: mix compile
        env:
          MIX_ENV: test

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      # actions/checkout@v7.0.1
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # erlef/setup-beam@v1.24.1
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      # Restore-only — the `deps` job is the sole writer. See its comment.
      # actions/cache/restore@v6.1.0 (same commit as actions/cache, sub-action path)
      - name: Restore dependencies cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      # ~16s, not "near-instant": the first `mix compile` after a cache restore always
      # rebuilds the whole tree, because a fresh checkout gives every source a newer mtime
      # than the restored manifest. Subsequent compiles in the same job are free.
      #
      # This step must stay the FIRST compile in the job. `mix lint_translations` below
      # ends up recompiling everything too (gettext.extract calls
      # `Mix.Task.run("compile", ["--force-elixir"])`), so running it first would leave
      # nothing for --warnings-as-errors to process — silently turning the warning gate
      # into a no-op. The duplicate compile is the price of keeping the gate real.
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Check code formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Typography lint
        run: mix lint_typography

      - name: Gettext catalog check (structure + DE completeness)
        run: mix lint_translations

  # Release-please's Release PR only ever touches .release-please-manifest.json,
  # CHANGELOG.md and mix.exs's `version:` — content already tested on main. Running the
  # full suite plus a browser E2E pass for a version bump costs ~9 billable minutes twice
  # (once on the PR, once on the squash commit). `quality` deliberately still runs: format
  # and credo over a bumped mix.exs are cheap and catch a malformed version.
  #
  # paths-ignore can't express this — mix.exs is in the changed set, and ignoring mix.exs
  # would blind CI to real dependency changes.
  #
  # Duplicated on `e2e` below because Actions does not support YAML anchors. Keep in sync.
  #
  # NOTE: if required status checks are ever added to the `main` ruleset, verify GitHub's
  # skipped-vs-required semantics before relying on both together.
  test:
    name: Tests
    runs-on: ubuntu-latest
    if: >-
      github.head_ref != 'release-please--branches--main' &&
      !startsWith(github.event.head_commit.message, 'chore: release main')

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klass_hero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      # actions/checkout@v7.0.1
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # erlef/setup-beam@v1.24.1
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      # Restore-only — the `deps` job is the sole writer. See its comment.
      # actions/cache/restore@v6.1.0 (same commit as actions/cache, sub-action path)
      - name: Restore dependencies cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      # mix test alias (mix.exs) detects CI env and prepends
      # ecto.create --quiet + ecto.migrate --quiet automatically.
      # --include slow opts the 5k-row CSV smoke test into CI so
      # chunk-boundary correctness at scale is exercised on every PR.
      - name: Run tests
        run: mix test --include slow

  # Skip condition mirrors `test` above — see the rationale there.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: >-
      github.head_ref != 'release-please--branches--main' &&
      !startsWith(github.event.head_commit.message, 'chore: release main')

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klass_hero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      # actions/checkout@v7.0.1
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # erlef/setup-beam@v1.24.1
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      # Restore-only — the `deps` job is the sole writer. See its comment.
      # actions/cache/restore@v6.1.0 (same commit as actions/cache, sub-action path)
      - name: Restore dependencies cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      - name: Build assets
        run: mix assets.setup && mix assets.build

      # nanasess/setup-chromedriver@v3.0.0
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@e913548694400f275b4070efcd90f47dbbc8914c

      # Use the alias rather than duplicating its body: it sets WALLABY_E2E, without which
      # config/test.exs binds no HTTP socket and every browser test fails to connect.
      - name: Run E2E tests
        run: mix test.e2e

      # actions/upload-artifact@v7.0.1
      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-screenshots
          path: tmp/e2e_screenshots/
          retention-days: 7

  # The site icons are committed release artifacts — nothing in mix assets.deploy
  # builds them — so this job is the only thing linking the bytes to their source,
  # priv/brand/kh-mark.svg. site_icons_test.exs covers a different axis: it proves
  # the committed ICO is well-formed, which a stale ICO also is.
  #
  # Report-only by intent, like the hex-audit job in security.yml: it gets its own
  # red PR entry, but must stay OUT of the required-status-checks ruleset on
  # `main`. A Chrome major bump can shift Skia's antialiasing and red this on an
  # unrelated PR; the fix is a one-line regen commit, which must not gate a merge.
  #
  # No `needs:` and no Elixir — this runs off the deps job's critical path.
  site-icons:
    name: Site Icon Provenance
    runs-on: ubuntu-latest

    steps:
      # actions/checkout@v7.0.1
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Node and Google Chrome both ship on the runner image, and the generator
      # has no npm dependencies — hence no setup-node and no install step.
      # CHROME_BIN is set explicitly rather than leaning on the generator's
      # fallback list, so a runner image that moves the binary fails loudly.
      - name: Regenerate the site icons from kh-mark.svg
        run: node priv/brand/generate_icons.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
          CHROME_NO_SANDBOX: '1'

      - name: Fail if the committed artifacts drifted from their source
        run: |
          git diff --exit-code --stat \
            priv/static/favicon.ico \
            priv/static/images/icon.svg \
            priv/static/images/apple-touch-icon.png \
          || {
            echo "::error::Site icons are stale. Run 'node priv/brand/generate_icons.mjs' and commit the result."
            exit 1
          }
