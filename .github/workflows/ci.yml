name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

env:
  ELIXIR_VERSION: '1.20.2'
  OTP_VERSION: '29.0.2'
  MIX_OS_DEPS_COMPILE_PARTITION_COUNT: '4'

jobs:
  deps:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
      # actions/checkout@v6.0.2
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # erlef/setup-beam@v1.23.0
      - name: Set up Elixir
        uses: erlef/setup-beam@ee09b1e59bb240681c382eb1f0abc6a04af72764
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      # actions/cache@v5.0.4
      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            deps
            _build
          key: v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      # Compile all deps once before the NIF force-rebuild. `mix deps.compile
      # lazy_html --force` only rebuilds lazy_html itself — it does NOT
      # trigger compilation of transitive deps (fine, elixir_make,
      # cc_precompiler). On a warm cache they're already in _build/; on a
      # cold cache (e.g. after a runtime bump invalidates the cache key)
      # the --force step fails with "could not find an app file at
      # _build/test/lib/fine/ebin/fine.app".
      - name: Compile dependencies
        run: mix deps.compile
        env:
          MIX_ENV: test

      # Force-recompile NIF deps to prevent stale cache issues.
      # The restore-keys fallback can provide a NIF binary from a
      # previous version that doesn't match the current mix.lock.
      - name: Recompile NIF dependencies
        run: mix deps.compile lazy_html --force
        env:
          MIX_ENV: test

      # Compile both envs so downstream jobs get cache hits.
      # Dev: needed by quality job (includes boundary checker).
      # Test: needed by test job (avoids recompilation).
      - name: Compile (dev)
        run: mix compile

      - name: Compile (test)
        run: mix compile
        env:
          MIX_ENV: test

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: deps

    steps:
      # actions/checkout@v6.0.2
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # erlef/setup-beam@v1.23.0
      - name: Set up Elixir
        uses: erlef/setup-beam@ee09b1e59bb240681c382eb1f0abc6a04af72764
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      # actions/cache@v5.0.4
      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            deps
            _build
          key: v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      # Dev env compile: catches warnings + runs boundary checker.
      # Near-instant when cache hits from deps job.
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Check code formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Typography lint
        run: mix lint_typography

      - name: Gettext catalog check (structure + DE completeness)
        run: mix lint_translations

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: deps

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klass_hero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      # actions/checkout@v6.0.2
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # erlef/setup-beam@v1.23.0
      - name: Set up Elixir
        uses: erlef/setup-beam@ee09b1e59bb240681c382eb1f0abc6a04af72764
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      # actions/cache@v5.0.4
      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            deps
            _build
          key: v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      # mix test alias (mix.exs) detects CI env and prepends
      # ecto.create --quiet + ecto.migrate --quiet automatically.
      # --include slow opts the 5k-row CSV smoke test into CI so
      # chunk-boundary correctness at scale is exercised on every PR.
      - name: Run tests
        run: mix test --include slow

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: deps

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klass_hero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      # actions/checkout@v6.0.2
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # erlef/setup-beam@v1.23.0
      - name: Set up Elixir
        uses: erlef/setup-beam@ee09b1e59bb240681c382eb1f0abc6a04af72764
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      # actions/cache@v5.0.4
      - name: Restore dependencies cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        with:
          path: |
            deps
            _build
          key: v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      - name: Build assets
        run: mix assets.setup && mix assets.build

      # nanasess/setup-chromedriver@v2.4.0
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@c75c3d53d445b96d41dbf2355797b470953c6c30

      # Use the alias rather than duplicating its body: it sets WALLABY_E2E, without which
      # config/test.exs binds no HTTP socket and every browser test fails to connect.
      - name: Run E2E tests
        run: mix test.e2e

      # actions/upload-artifact@v4.6.2
      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-screenshots
          path: tmp/e2e_screenshots/
          retention-days: 7

  # The site icons are committed release artifacts — nothing in mix assets.deploy
  # builds them — so this job is the only thing linking the bytes to their source,
  # priv/brand/kh-mark.svg. site_icons_test.exs covers a different axis: it proves
  # the committed ICO is well-formed, which a stale ICO also is.
  #
  # Report-only by intent, like the hex-audit job in security.yml: it gets its own
  # red PR entry, but must stay OUT of the required-status-checks ruleset on
  # `main`. A Chrome major bump can shift Skia's antialiasing and red this on an
  # unrelated PR; the fix is a one-line regen commit, which must not gate a merge.
  #
  # No `needs:` and no Elixir — this runs off the deps job's critical path.
  site-icons:
    name: Site Icon Provenance
    runs-on: ubuntu-latest

    steps:
      # actions/checkout@v6.0.2
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Node and Google Chrome both ship on the runner image, and the generator
      # has no npm dependencies — hence no setup-node and no install step.
      # CHROME_BIN is set explicitly rather than leaning on the generator's
      # fallback list, so a runner image that moves the binary fails loudly.
      - name: Regenerate the site icons from kh-mark.svg
        run: node priv/brand/generate_icons.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
          CHROME_NO_SANDBOX: '1'

      - name: Fail if the committed artifacts drifted from their source
        run: |
          git diff --exit-code --stat \
            priv/static/favicon.ico \
            priv/static/images/icon.svg \
            priv/static/images/apple-touch-icon.png \
          || {
            echo "::error::Site icons are stale. Run 'node priv/brand/generate_icons.mjs' and commit the result."
            exit 1
          }
