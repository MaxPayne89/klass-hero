name: CI

# Pull requests only. Re-verifying a squash commit on `main` that a PR run verified minutes
# earlier cost ~8 billable minutes per merge (#1198). The three roles the main-push run used
# to fill are covered elsewhere now: the dev deploy triggers on push (fly-deploy.yml), the
# default-branch dep cache is written by deps-cache.yml, and PR CI is enforced by the
# `required_status_checks` rule on the `main` ruleset rather than after the merge.
on:
  pull_request:
    branches: [ '**' ]

# Supersede an in-flight run when a PR is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Bumping either version here means bumping it in deps-cache.yml and security.yml too. A
# called workflow does not inherit the caller's `env`, and both versions are baked into the
# cache key AND its restore-keys prefix — so a one-sided bump means the writer stores under a
# key no reader ever asks for, and every job compiles from cold, indefinitely and silently.
env:
  ELIXIR_VERSION: '1.20.2'
  OTP_VERSION: '29.0.2'
  MIX_OS_DEPS_COMPILE_PARTITION_COUNT: '4'

jobs:
  # The cache writer, defined once in deps-cache.yml because it also has to run on push to
  # main — see that file's header. Nothing `needs:` it: on a warm run it hits the primary key
  # and saves nothing, so downstream jobs restore byte-identical content whether or not it
  # ran, and gating them on it was ~55s of pure serialisation (#1201). On a PR it earns its
  # place only on a cold cache, where it seeds the PR-scoped cache that later pushes to the
  # same PR restore.
  deps:
    uses: ./.github/workflows/deps-cache.yml

  # Every job below caps `timeout-minutes`. The default is 360, so one hung process — a
  # headless Chrome that never exits, a browser test waiting on a socket — can burn six
  # billable hours in a job that normally takes one minute, which dwarfs anything this
  # workflow's tuning saves. Caps are ~10x the observed runtime: generous enough that a
  # slow runner never trips them, tight enough that a hang is cheap.
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # actions/checkout@v7.0.1
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # erlef/setup-beam@v1.24.1
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      # Restore-only — deps-cache.yml is the sole writer. See its header.
      # actions/cache/restore@v6.1.0 (same commit as actions/cache, sub-action path)
      - name: Restore dependencies cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      # ~16s, not "near-instant": the first `mix compile` after a cache restore always
      # rebuilds the whole tree, because a fresh checkout gives every source a newer mtime
      # than the restored manifest. Subsequent compiles in the same job are free.
      #
      # This step must stay the FIRST compile in the job. `mix lint_translations` below
      # ends up recompiling everything too (gettext.extract calls
      # `Mix.Task.run("compile", ["--force-elixir"])`), so running it first would leave
      # nothing for --warnings-as-errors to process — silently turning the warning gate
      # into a no-op. The duplicate compile is the price of keeping the gate real.
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Check code formatting
        run: mix format --check-formatted

      # `precommit` runs the mutating `deps.unlock --unused`, which fixes the lock file
      # locally and so never fails. Nothing checked it here, meaning an orphaned lock
      # entry only surfaced if someone happened to run precommit before pushing.
      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      # Keeps a runtime dependency from silently becoming a compile-time one, which
      # balloons recompiles across a 7-context app. Threshold is the count at the time
      # this landed — see the note in mix.exs's precommit alias.
      - name: No new compile-time coupling
        run: mix xref graph --label compile-connected --fail-above 32

      - name: Credo
        run: mix credo --strict

      - name: Typography lint
        run: mix lint_typography

      - name: Hero colour tokens resolve
        run: mix lint_hero_colors

      - name: Gettext catalog check (structure + DE completeness)
        run: mix lint_translations

      # Text-based, compiles nothing — safe to append without displacing the
      # --warnings-as-errors compile above.
      - name: Projection read-table convention
        run: mix lint_read_tables

      - name: Cross-context table reads are traced
        run: mix lint_acl_boundary

      - name: raw/1 calls are waived with a reason
        run: mix lint_raw_html

      - name: Agent-facing docs cite things that exist
        run: mix lint_doc_refs

      # Was precommit-only. A check that runs locally but not in CI is exactly the
      # drift these gates exist to stop, so it runs in both now.
      - name: Palette tokens are internally consistent
        run: mix lint_palette

  # The counterpart to the skip documented on `test` below: that skip is only safe while a
  # Release PR's diff really is a version bump over content already tested on main. This job
  # is what makes that true rather than assumed. Runs only on the Release PR (~20s), so it
  # costs nothing on ordinary PRs.
  #
  # When it fails, the Release PR is carrying someone else's reverted work. Do not "fix" the
  # diff by hand — close the PR and delete the release-please--branches--main branch; the
  # next push to main regenerates it from current content.
  release-pr-guard:
    name: Release PR Diff Shape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.head_ref == 'release-please--branches--main'

    steps:
      # fetch-depth: 0 because the check is a diff against the merge base, which a depth-1
      # checkout cannot reach.
      # actions/checkout@v7.0.1
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # BASE_REF goes through env rather than inline `${{ }}` in run: — a ref name is
      # attacker-influenced input and inline interpolation is a shell-injection sink.
      - name: Release PR changes only release files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          unexpected=$(echo "$changed" | grep -vxE 'mix\.exs|CHANGELOG\.md|\.release-please-manifest\.json' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Release PR touches files it does not own:"
            echo "$unexpected"
            exit 1
          fi

      - name: Release PR changes only mix.exs's version
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # --unified=0 so no context line is mistaken for a change.
          extra=$(git diff --unified=0 "origin/${BASE_REF}...HEAD" -- mix.exs \
            | grep -E '^[-+][^-+]' \
            | grep -vE '^[-+][[:space:]]*version: "[0-9]+\.[0-9]+\.[0-9]+",$' || true)
          if [ -n "$extra" ]; then
            echo "::error::Release PR changes mix.exs beyond version: — it is reverting merged work."
            echo "$extra"
            exit 1
          fi

  # A Release PR can carry a REVERT of someone's merged mix.exs change. #1266 reverted the
  # precommit warning gate #1265 had added 81 minutes earlier: its head commit was parented
  # on #1265's merge, yet its mix.exs was byte-identical to main from before #1265 apart
  # from `version:`.
  #
  # The cause is concurrent workflow runs, not a stale branch. Each run of release-please.yml
  # force-pushes the Release PR from its own read of main; #1264 and #1265 merged 11s apart,
  # so two ran at once and the older one finished last and overwrote the newer. That is fixed
  # at source by the `concurrency` group in release-please.yml — release-please does re-read
  # main on every regeneration, which #1281 shows: opened before #1279, it regenerated after
  # it and carried #1279's mix.exs correctly.
  #
  # `release-pr-guard` below is the backstop for that prevention, and what keeps this skip
  # honest: the Release PR touches .release-please-manifest.json, CHANGELOG.md and mix.exs's
  # `version:` and nothing else — content already tested on main. Running the full suite
  # plus a browser E2E pass for a version bump costs ~9 billable minutes.
  # `quality` deliberately still runs: format and credo over a bumped mix.exs are cheap and
  # catch a malformed version.
  #
  # paths-ignore can't express this — mix.exs is in the changed set, and ignoring mix.exs
  # would blind CI to real dependency changes.
  #
  # Duplicated on `e2e` below because Actions does not support YAML anchors. Keep in sync.
  #
  # `Tests` and `E2E Tests` are required status checks on the `main` ruleset, which is safe
  # alongside this skip: an `if:`-skipped job still emits a check run (conclusion `skipped`),
  # and a skipped check satisfies a required one. The trap that leaves a required check
  # Pending forever needs a WORKFLOW that never runs at all — path/branch filters — which is
  # why the skip lives on the jobs and not on the trigger.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.head_ref != 'release-please--branches--main'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klass_hero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      # actions/checkout@v7.0.1
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # erlef/setup-beam@v1.24.1
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      # Restore-only — deps-cache.yml is the sole writer. See its header.
      # actions/cache/restore@v6.1.0 (same commit as actions/cache, sub-action path)
      - name: Restore dependencies cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      # mix test alias (mix.exs) detects CI env and prepends
      # ecto.create --quiet + ecto.migrate --quiet automatically.
      # --include slow opts the 5k-row CSV smoke test into CI so
      # chunk-boundary correctness at scale is exercised on every PR.
      # --warnings-as-errors covers the test files themselves; the
      # compile job's gate runs in dev env and never sees them.
      - name: Run tests
        run: mix test --warnings-as-errors --include slow

  # Skip condition mirrors `test` above — see the rationale there.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.head_ref != 'release-please--branches--main'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: klass_hero_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      # actions/checkout@v7.0.1
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # erlef/setup-beam@v1.24.1
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      # Restore-only — deps-cache.yml is the sole writer. See its header.
      # actions/cache/restore@v6.1.0 (same commit as actions/cache, sub-action path)
      - name: Restore dependencies cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      - name: Build assets
        run: mix assets.setup && mix assets.build

      # nanasess/setup-chromedriver@v3.0.0
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@e913548694400f275b4070efcd90f47dbbc8914c

      # Use the alias rather than duplicating its body: it sets WALLABY_E2E, without which
      # config/test.exs binds no HTTP socket and every browser test fails to connect.
      - name: Run E2E tests
        run: mix test.e2e

      # actions/upload-artifact@v7.0.1
      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-screenshots
          path: tmp/e2e_screenshots/
          retention-days: 7

  # Nothing else in CI runs priv/repo/seeds.exs, so seeding drifted from the code it seeds
  # until `mix setup` was broken for every new contributor and every fresh worktree (#1222).
  # A unit test cannot cover this: seeds rebuild the CQRS read tables through
  # `Projection.rebuild/1`, which is a GenServer.call on the named process, and
  # config/test.exs sets `start_projections: false` so those processes never exist in
  # MIX_ENV=test. Hence a dev-env job — do NOT "tidy" this to MIX_ENV=test, it would turn
  # the gate into a no-op that passes on a database with empty read tables.
  #
  # Postgres only: seeds tolerate a dead MinIO (the Storage.upload call matches {:error, _}
  # and warns), so no S3-compatible service is needed. That costs ~60s, measured on the
  # runner: 12 seeded verification documents at ~5s each of ExAws retry backoff against a
  # refused connection. It dominates this job — the seeding itself is ~4s — so if the job
  # ever needs to get cheaper, that is the thing to cut, not the steps.
  #
  # Paying it beats the alternatives: Actions service containers cannot express MinIO's
  # `command: server /data` (see docker-compose.yml), and hand-rolling `docker run` would
  # make a blocking gate depend on a service it does not even test.
  #
  # No assets step either — `mix run` does not set `server: true`, so the endpoint never
  # binds and the esbuild/tailwind watchers never start.
  #
  # POSTGRES_DB is deliberately absent: `mix ecto.create` makes klass_hero_dev itself, which
  # is the step a fresh contributor actually runs.
  #
  # Skip condition mirrors `test` above — see the rationale there.
  seed:
    name: Fresh Seed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.head_ref != 'release-please--branches--main'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # actions/checkout@v7.0.1
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # erlef/setup-beam@v1.24.1
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          version-type: strict

      # Restore-only — deps-cache.yml is the sole writer. See its header.
      # actions/cache/restore@v6.1.0 (same commit as actions/cache, sub-action path)
      - name: Restore dependencies cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            deps
            _build
          key: v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-mix-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Create and migrate a fresh database
        run: mix ecto.create && mix ecto.migrate

      - name: Seed it
        run: mix ecto.seed

  # The site icons are committed release artifacts — nothing in mix assets.deploy
  # builds them — so this job is the only thing linking the bytes to their source,
  # priv/brand/kh-mark.svg. site_icons_test.exs covers a different axis: it proves
  # the committed ICO is well-formed, which a stale ICO also is.
  #
  # Report-only by intent, like the hex-audit job in security.yml: it gets its own
  # red PR entry, but must stay OUT of the required-status-checks ruleset on
  # `main`. A Chrome major bump can shift Skia's antialiasing and red this on an
  # unrelated PR; the fix is a one-line regen commit, which must not gate a merge.
  #
  # No `needs:` and no Elixir — this runs off the deps job's critical path.
  # 5 minutes against an observed ~30s: the generator drives headless Chrome, which is the
  # one step here that can hang instead of fail — it did on the first run of PR #1202,
  # sitting `in_progress` for half an hour on a job that had never taken a minute.
  site-icons:
    name: Site Icon Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # actions/checkout@v7.0.1
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Node and Google Chrome both ship on the runner image, and the generator
      # has no npm dependencies — hence no setup-node and no install step.
      # CHROME_BIN is set explicitly rather than leaning on the generator's
      # fallback list, so a runner image that moves the binary fails loudly.
      - name: Regenerate the site icons from kh-mark.svg
        run: node priv/brand/generate_icons.mjs
        env:
          CHROME_BIN: /usr/bin/google-chrome
          CHROME_NO_SANDBOX: '1'

      - name: Fail if the committed artifacts drifted from their source
        run: |
          git diff --exit-code --stat \
            priv/static/favicon.ico \
            priv/static/images/icon.svg \
            priv/static/images/apple-touch-icon.png \
          || {
            echo "::error::Site icons are stale. Run 'node priv/brand/generate_icons.mjs' and commit the result."
            exit 1
          }
