<!--
  Klass Hero "KH" monogram — geometry source for every shipped icon.
  Regenerate with: node priv/brand/generate_icons.mjs

  Strokes, not <text>: a favicon SVG is fetched standalone and cannot reach the
  page's webfonts. Round caps extend ink by stroke-width/2 past each endpoint,
  so the 8px fill spans x 4.5→59.5, y 10→54 and the 11px yellow outline drawn
  behind it spans x 3→61, y 8.5→55.5 — both inside the 64 box.
  Colour lives in the generator; the values here are for preview.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <g id="mark" fill="none" stroke="#0FC3FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 8.5 14 V 50" />
    <path d="M 8.5 32 L 25 14" />
    <path d="M 8.5 32 L 25 50" />
    <path d="M 40 14 V 50" />
    <path d="M 55.5 14 V 50" />
    <path d="M 40 32 H 55.5" />
  </g>
</svg>
